app = "specprompt"
primary_region = "ord"

[build]

[env]
  PHX_HOST = "app.specprompt.com"
  PORT = "4000"

[http_service]
  internal_port = 4000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
